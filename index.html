<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101113" />
    <meta
      name="description"
      content="IRONLOG — votre carnet de musculation privé, rapide et hors ligne."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="IRONLOG" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>IRONLOG — Lift. Log. Repeat.</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <aside
      id="update-prompt"
      class="update-prompt"
      role="dialog"
      aria-modal="false"
      aria-labelledby="update-title"
      hidden
    >
      <div class="update-copy">
        <span class="eyebrow">NOUVELLE VERSION</span
        ><strong id="update-title">IRONLOG est prêt à être mis à jour.</strong>
        <p>Vos exercices et vos séries restent sur cet appareil.</p>
      </div>
      <div class="update-actions">
        <button id="update-later" type="button" class="outline-btn">
          Plus tard</button
        ><button id="update-now" type="button" class="primary-btn">
          Mettre à jour
        </button>
      </div>
    </aside>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
